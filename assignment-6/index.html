<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assignment 6 - Task Manager</title><script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>body{font-family:Arial;background:#f1f5f9}.app{max-width:700px;margin:50px auto}.box{background:white;padding:25px;border-radius:15px}input,button{padding:11px;border-radius:8px;border:1px solid #ccc}button{background:#2563eb;color:white;border:0;margin-left:5px}.task{padding:12px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}</style></head><body><div id="root"></div><script type="text/babel">function App(){const[t,setT]=React.useState("");const[list,setList]=React.useState([]);return <div className="app"><div className="box"><h1>Task Manager</h1><input value={t} onChange={e=>setT(e.target.value)} placeholder="New task"/><button onClick={()=>{if(t){setList([...list,t]);setT("")}}}>Add</button>{list.map((x,i)=><div className="task"><span>{x}</span><button onClick={()=>setList(list.filter((_,j)=>j!==i))}>Done</button></div>)}</div></div>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
