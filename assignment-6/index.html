<!doctype html><html><head><meta charset="UTF-8"><title>Assignment 6 - Task Manager</title><style>body{font-family:Arial;background:#f5f7fb;padding:30px}main{max-width:900px;margin:auto}.card{background:white;padding:18px;border-radius:12px;margin:10px 0}input,button,select{padding:10px;margin:4px}</style></head><body><div id="root"></div><script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script type="text/babel">function App(){const[t,setT]=React.useState([{id:1,title:"React Assignment",status:"Pending"}]);const[title,setTitle]=React.useState("");function add(e){e.preventDefault();if(title)setT([...t,{id:Date.now(),title,status:"Raised"}]);setTitle("")}return <main><h1>Assignment 6: Task Manager</h1><form onSubmit={add}><input required placeholder="Task title" value={title} onChange={e=>setTitle(e.target.value)}/><button>Add Task</button></form>{t.map(x=><div className="card" key={x.id}><h3>{x.title}</h3><p>Status: {x.status}</p><button onClick={()=>setT(t.map(y=>y.id===x.id?{...y,status:y.status==="Closed"?"Pending":"Closed"}:y))}>{x.status==="Closed"?"Reopen":"Complete"}</button><button onClick={()=>setT(t.filter(y=>y.id!==x.id))}>Delete</button></div>)}</main>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
