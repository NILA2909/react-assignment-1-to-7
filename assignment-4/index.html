<!doctype html><html><head><meta charset="UTF-8"><title>Assignment 4 - Weather Dashboard</title><style>body{font-family:Arial;background:#f5f7fb;padding:30px}main{max-width:800px;margin:auto;background:white;padding:30px;border-radius:16px}input,button{padding:11px;margin:5px}</style></head><body><div id="root"></div><script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script type="text/babel">function App(){const [city,setCity]=React.useState("");const [w,setW]=React.useState(null);async function search(e){e.preventDefault();const key=prompt("Enter OpenWeatherMap API key");if(!key)return;const r=await fetch('https://api.openweathermap.org/data/2.5/weather?q='+encodeURIComponent(city)+'&appid='+key+'&units=metric');if(r.ok)setW(await r.json());else alert("City not found")}return <main><h1>Assignment 4: Weather Dashboard</h1><form onSubmit={search}><input required placeholder="Enter city" value={city} onChange={e=>setCity(e.target.value)}/><button>Search</button></form>{w&&<section><h2>{w.name}</h2><p>Temperature: {w.main.temp} °C</p><p>Humidity: {w.main.humidity}%</p><p>Wind Speed: {w.wind.speed} m/s</p><p>Weather: {w.weather[0].description}</p></section>}</main>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
