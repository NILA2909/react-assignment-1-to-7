<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assignment 4 - Weather Dashboard</title><script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>body{font-family:Arial;background:#dbeafe;margin:0}.app{max-width:700px;margin:60px auto;background:white;padding:30px;border-radius:18px;text-align:center}input,button{padding:12px;margin:5px;border-radius:8px;border:1px solid #bbb}button{background:#2563eb;color:white;border:0}</style></head><body><div id="root"></div><script type="text/babel">function App(){const[c,setC]=React.useState("");const[city,setCity]=React.useState("Kolkata");return <div className="app"><h1>Weather Dashboard</h1><input value={c} onChange={e=>setC(e.target.value)} placeholder="Enter city"/><button onClick={()=>setCity(c||"Kolkata")}>Search</button><h2>{city}</h2><p>☀️ 28°C</p><p>Weather information dashboard built with React.</p></div>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
