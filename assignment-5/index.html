<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assignment 5 - Shopping Cart</title><script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>body{font-family:Arial;background:#f5f5f5}.app{max-width:800px;margin:40px auto}.item,.cart{background:white;padding:20px;margin:15px 0;border-radius:12px}.row{display:flex;justify-content:space-between;align-items:center}button{padding:9px 14px;border:0;border-radius:7px;background:#111827;color:white}</style></head><body><div id="root"></div><script type="text/babel">function App(){const[p]=React.useState([{n:"Laptop",p:55000},{n:"Headphones",p:2500},{n:"Mouse",p:900}]);const[c,setC]=React.useState([]);return <div className="app"><h1>Shopping Cart</h1>{p.map(x=><div className="item row"><span><b>{x.n}</b><br/>₹{x.p}</span><button onClick={()=>setC([...c,x])}>Add to Cart</button></div>)}<div className="cart"><h2>Cart ({c.length})</h2>{c.map(x=><p>{x.n} — ₹{x.p}</p>)}<b>Total: ₹{c.reduce((a,x)=>a+x.p,0)}</b></div></div>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
