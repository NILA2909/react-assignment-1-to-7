<!doctype html><html><head><meta charset="UTF-8"><title>Assignment 5 - Shopping Cart</title><style>body{font-family:Arial;background:#f5f7fb;padding:30px}main{max-width:900px;margin:auto}.card,.row{background:white;padding:18px;border-radius:12px;margin:10px 0}button,input{padding:10px;margin:4px}</style></head><body><div id="root"></div><script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script type="text/babel">const products=[{id:1,name:"Laptop",price:50000},{id:2,name:"Headphone",price:2000},{id:3,name:"Mouse",price:800}];function App(){const[c,setC]=React.useState([]);function add(p){setC(x=>{let f=x.find(y=>y.id===p.id);return f?x.map(y=>y.id===p.id?{...y,q:y.q+1}:y):[...x,{...p,q:1}]})}const total=c.reduce((s,x)=>s+x.price*x.q,0);return <main><h1>Assignment 5: Online Shopping Cart</h1>{products.map(p=><div className="card" key={p.id}><h3>{p.name}</h3><p>₹{p.price}</p><button onClick={()=>add(p)}>Add to Cart</button></div>)}<h2>Cart</h2>{c.map(x=><div className="row" key={x.id}>{x.name} × {x.q} = ₹{x.price*x.q}<button onClick={()=>setC(c.filter(y=>y.id!==x.id))}>Remove</button></div>)}<h2>Grand Total: ₹{total}</h2></main>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
