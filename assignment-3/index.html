<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assignment 3 - Employee Directory</title><script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>body{font-family:Arial;margin:0;background:#eef2f7}main{max-width:1000px;margin:35px auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.card{background:white;padding:22px;border-radius:14px;box-shadow:0 3px 12px #0001}</style></head><body><div id="root"></div><script type="text/babel">function App(){const e=[["Amit Roy","Developer","amit@example.com"],["Riya Sen","Designer","riya@example.com"],["Rahul Das","Manager","rahul@example.com"],["Mita Paul","HR Executive","mita@example.com"]];return <main><h1>Employee Directory</h1><div className="grid">{e.map(x=><div className="card"><h2>{x[0]}</h2><p><b>Role:</b> {x[1]}</p><p>{x[2]}</p></div>)}</div></main>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
