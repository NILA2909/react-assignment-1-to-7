<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assignment 7 - Authentication System</title><script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>body{font-family:Arial;background:#e0e7ff}.box{max-width:420px;margin:80px auto;background:white;padding:30px;border-radius:16px}.field{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}button{width:100%;padding:12px;border:0;border-radius:8px;background:#4f46e5;color:white}</style></head><body><div id="root"></div><script type="text/babel">function App(){const[email,setEmail]=React.useState("");const[pass,setPass]=React.useState("");const[msg,setMsg]=React.useState("");return <div className="box"><h1>Login</h1><input className="field" value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email"/><input className="field" type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="Password"/><button onClick={()=>setMsg(email&&pass?"Login successful!":"Please enter email and password")}>Login</button><p>{msg}</p></div>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
