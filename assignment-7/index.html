<!doctype html><html><head><meta charset="UTF-8"><title>Assignment 7 - Authentication System</title><style>body{font-family:Arial;background:#f5f7fb;padding:30px}main{max-width:600px;margin:auto;background:white;padding:30px;border-radius:16px}input,button{display:block;padding:11px;margin:10px 0;width:100%}</style></head><body><div id="root"></div><script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script type="text/babel">function App(){const[u,setU]=React.useState("");const[p,setP]=React.useState("");const[logged,setLogged]=React.useState(false);return <main><h1>Assignment 7: Authentication System</h1>{!logged?<form onSubmit={e=>{e.preventDefault();if(u&&p)setLogged(true)}}><input required placeholder="Username" value={u} onChange={e=>setU(e.target.value)}/><input required type="password" placeholder="Password" value={p} onChange={e=>setP(e.target.value)}/>{p&&<p>Password Strength: {p.length<4?"Weak":p.length<8?"Medium":"Strong"}</p>}<button>Login</button></form>:<section><h2>Welcome, {u}</h2><p>Protected Dashboard</p><button onClick={()=>setLogged(false)}>Logout</button></section>}</main>}ReactDOM.createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
